plugins:
  - rubocop-rails

require:
  - ../lib/minchalle_rubocop/cop/migrations/null_false.rb

AllCops:
  TargetRailsVersion: 8.0
  NewCops: enable
  Exclude:
    - 'docker/**/*'
    - 'vendor/**/*'
    - 'db/schema.rb'

Rails/Blank:
  UnlessPresent: false

Rails/UnknownEnv:
  Environments:
    - production
    - staging
    - development
    - dev_local
    - test

